<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08050d">

<title>anime gHoSt</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050509;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 20%,#a500ff30,transparent 25%),
        radial-gradient(circle at 85% 30%,#ff00cc20,transparent 25%),
        radial-gradient(circle at 50% 90%,#6200ff20,transparent 30%),
        #050509;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    animation:orbMove 12s infinite alternate ease-in-out;
}

.orb1{
    width:250px;
    height:250px;
    background:#9d00ff;
    top:5%;
    left:-80px;
}

.orb2{
    width:300px;
    height:300px;
    background:#ff0099;
    right:-100px;
    top:35%;
    animation-delay:2s;
}

.orb3{
    width:250px;
    height:250px;
    background:#3000ff;
    bottom:-100px;
    left:35%;
    animation-delay:4s;
}

@keyframes orbMove{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(80px,-50px) scale(1.3);
    }
}

/* PARTICLES */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:starMove linear infinite;
}

@keyframes starMove{
    from{
        transform:translateY(0);
        opacity:.1;
    }
    50%{
        opacity:1;
    }
    to{
        transform:translateY(-120px);
        opacity:0;
    }
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    width:100%;
    padding:12px 4%;
    display:flex;
    align-items:center;
    gap:15px;
    background:rgba(5,5,9,.78);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
}

.logo{
    white-space:nowrap;
    font-size:24px;
    font-weight:600;
    letter-spacing:-1px;
}

.logoGhost{
    display:inline-block;
    animation:ghostFloat 2s infinite ease-in-out;
}

@keyframes ghostFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-6px) rotate(5deg);
    }
}

.logo span{
    color:#e75cff;
    text-shadow:
        0 0 8px #e75cff,
        0 0 25px #a000ff;
}

/* SEARCH */

.searchBox{
    flex:1;
    max-width:750px;
    margin:auto;
